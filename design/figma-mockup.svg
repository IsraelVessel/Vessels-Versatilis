    <text x="20" y="60" font-family="Arial" font-size="14" fill="#374151">Vessels Versatilis is a parent corporation that owns several independent companies in</text>
    <text x="20" y="82" font-family="Arial" font-size="14" fill="#374151">unrelated industries. Main focus: contracting and specialised services.</text>
  </g>

  <rect x="40" y="480" width="1120" height="240" rx="8" fill="#ffffff" stroke="#e6eef0" />
  <text x="60" y="520" font-family="Arial" font-size="16" fill="#0b1720">Editable admin: JSON-based editor lives in the app. Admin can edit company fields and save to localStorage or download JSON.</text>

  <text x="40" y="760" font-family="Arial" font-size="12" fill="#94a3b8">Design mockup — import into Figma as an image for visual reference.</text>
