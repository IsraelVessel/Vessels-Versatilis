<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f7f9fb"/>
  <rect x="0" y="0" width="1200" height="160" fill="#0b5563" rx="0"/>
  <text x="40" y="60" fill="#ffffff" font-family="Arial" font-size="36">Vessels Versatilis</text>
  <text x="40" y="100" fill="#e6f7f8" font-family="Arial" font-size="14">Specialised Services · Contracting · Large Enterprise</text>

  <g transform="translate(40,200)">
    <rect width="540" height="240" rx="8" fill="#ffffff" stroke="#e6eef0" />
    <text x="20" y="30" font-family="Arial" font-size="18" fill="#0b1720">Business Details</text>
    <text x="20" y="60" font-family="Arial" font-size="14" fill="#374151">Address: N0 14 Off Oguniyi Avenue Ado Ekiti</text>
    <text x="20" y="86" font-family="Arial" font-size="14" fill="#374151">Category: large Business</text>
    <text x="20" y="112" font-family="Arial" font-size="14" fill="#374151">Structure: Sole Proprietorship</text>
